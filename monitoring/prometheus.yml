# Prometheus (bonus observabilité) : collecte les indicateurs du pipeline poussés
# dans la Pushgateway par scripts/export_prometheus.py.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
